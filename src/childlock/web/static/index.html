<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차일드락 PC/SIL 시뮬레이터</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --card: #ffffff; --line: #dcdcd6; --lock: #b3261e; --release: #1b6e3a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --card: #20201f; --line: #3a3a37; --lock: #f2b8b5; --release: #8fd6a6; } }
  body { margin: 0; font-family: system-ui, "Malgun Gothic", sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 960px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 0; } h2 { font-size: 1rem; margin: 0 0 12px; }
  .doors { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .door { text-align: center; padding: 16px; border: 1px solid var(--line); border-radius: 6px; font-size: 1.4rem; font-weight: 600; }
  .LOCK { color: var(--lock); } .RELEASE { color: var(--release); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 12px 0 0; }
  dt { color: var(--muted); } dd { margin: 0; font-family: ui-monospace, Consolas, monospace; }
  form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  label { display: flex; gap: 6px; align-items: center; } button { padding: 6px 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>전자식 차일드락 PC/SIL 시뮬레이터</h1>
  <section aria-label="현재 상태">
    <h2>현재 상태 (SWR-014, SWR-015)</h2>
    <div class="doors">
      <div class="door">좌측 <span id="lock_left">-</span></div>
      <div class="door">우측 <span id="lock_right">-</span></div>
    </div>
    <dl>
      <dt>state</dt><dd id="state">-</dd>
      <dt>입력 유효성</dt><dd id="input_validity">-</dd>
      <dt>판정 근거 (priority_reason)</dt><dd id="priority_reason">-</dd>
      <dt>이유 코드 (reason_code)</dt><dd id="reason_code">-</dd>
      <dt>경고 코드</dt><dd id="warning_code">-</dd>
    </dl>
  </section>
  <section aria-label="차량 입력">
    <h2>차량 입력 (VehicleSnapshot)</h2>
    <form id="snapshot">
      <label>차속(km/h) <input name="vehicle_speed_kph" type="number" step="0.1" value="0"></label>
      <label>기어 <select name="gear"><option>P</option><option>N</option><option>D</option><option>R</option></select></label>
      <label>충돌 <select name="crash_status"><option>NONE</option><option>PENDING</option><option>CONFIRMED</option></select></label>
      <label><input type="checkbox" name="ignition_on" checked> 시동 ON</label>
      <label><input type="checkbox" name="rear_left_approach_risk"> 좌 접근위험</label>
      <label><input type="checkbox" name="rear_right_approach_risk"> 우 접근위험</label>
      <label><input type="checkbox" name="fire_detected"> 화재</label>
      <label><input type="checkbox" name="overtemperature_detected"> 과온</label>
      <label><input type="checkbox" name="adult_present"> 성인 탑승</label>
      <label><input type="checkbox" name="isofix_left"> 좌 ISOFIX</label>
      <label><input type="checkbox" name="isofix_right"> 우 ISOFIX</label>
      <label><input type="checkbox" name="sensor_fault"> 센서 고장</label>
    </form>
    <p>입력은 100 ms마다 현재 값으로 자동 전송됩니다(freshness 유지).</p>
  </section>
  <section aria-label="운전자 명령">
    <h2>운전자 명령 (DriverCommand)</h2>
    <label>경로 <select id="source"><option>physical_button</option><option>avn</option><option>voice</option><option>mobile_app</option></select></label>
    <div class="row" id="commands"></div>
  </section>
</main>
<script>
  const FIELDS = ["lock_left", "lock_right", "state", "input_validity", "priority_reason", "reason_code", "warning_code"];
  function snapshot() {
    const form = document.getElementById("snapshot");
    const data = {};
    for (const el of form.elements) {
      if (el.type === "checkbox") data[el.name] = el.checked;
      else if (el.type === "number") data[el.name] = Number(el.value);
      else data[el.name] = el.value;
    }
    return data;
  }
  async function post(path, body) {
    await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  }
  async function refresh() {
    try {
      const res = await fetch("/api/status");
      const status = await res.json();
      for (const f of FIELDS) {
        const el = document.getElementById(f);
        el.textContent = res.ok ? (status[f] ?? "-") : "HTTP " + res.status;
        if (f.startsWith("lock_")) el.className = status[f] || "";
      }
    } catch (e) { /* 서버 재시작 중에는 다음 주기에 다시 시도 */ }
  }
  async function sendSnapshot() {
    // 시각(source_timestamp_s)은 서버가 수신 시각으로 채운다(stamp=true)
    try { await post("/api/snapshot?stamp=true", snapshot()); } catch (e) { /* 다음 주기에 재시도 */ }
  }
  for (const side of ["left", "right", "all"]) {
    for (const action of ["lock", "unlock"]) {
      const b = document.createElement("button");
      b.textContent = `${side} ${action}`;
      b.onclick = () => post("/api/command", { side, action, source: document.getElementById("source").value });
      document.getElementById("commands").appendChild(b);
    }
  }
  setInterval(sendSnapshot, 100);
  setInterval(refresh, 200);
  refresh();
</script>
</body>
</html>
