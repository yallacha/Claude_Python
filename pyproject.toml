[project]
name = "childlock"
version = "0.1.0"
description = "전자식 차일드락 제어 SW (PC/SIL 참조 구현)"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]
# .claude 아래 스킬 보조 스크립트는 제품 코드가 아니므로 품질 검사 대상에서 제외한다
extend-exclude = [".claude"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import 정렬, N: 명명 규칙(Google Python Style Guide),
# B: bugbear, UP: 최신 문법, C90: 순환 복잡도
select = ["E", "W", "F", "I", "N", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["src", "tools"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
